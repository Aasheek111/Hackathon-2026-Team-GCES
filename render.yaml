databases:
  - name: neurolearn-db
    databaseName: neurolearn
    user: neurolearn

services:
  - type: web
    name: neurolearn-api
    env: node
    buildCommand: "cd backend && npm install && npx prisma generate && npm run build"
    startCommand: "cd backend && npx prisma migrate deploy && npm run seed && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neurolearn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "5000"

  - type: web
    name: neurolearn-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: neurolearn-api
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
